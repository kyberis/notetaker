name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-at-least-32-chars-long-for-build
          OPENAI_API_KEY: sk-test
